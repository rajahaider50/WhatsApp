name: Build WhatsApp Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: WhatsApp Android Native v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## 📱 WhatsApp Android Native Application

            Official native Android WhatsApp release with end-to-end Firebase and Cloudinary integrations.

            ### ✨ Key Features Included:
            - **Native Android UI**: Edge-to-edge support with perfect status bar & bottom navigation bar sizing (Android 9 to 15).
            - **Official Icons**: Clean Material & Vector icons across the app (strict zero emojis as UI icons).
            - **Firebase Authentication**: Email & Password registration and Google Sign-In (no phone OTP).
            - **3-Option Recovery System**: Configure and verify with 8-digit Forget Code, 13-digit CNIC, or Restore Phone Number.
            - **Firebase Realtime Database**: Lifetime running rules for real-time messaging, presence, and live availability checks.
            - **Cloudinary Storage**: High-speed storage for photos, videos, voice notes, and view-once media.
            - **HD Voice Recording Studio**: Live animated waveform with audio trimming and cropping before sending.
            - **Live Audio & Video Calls**: Fullscreen incoming call UI with ringtone and in-call controls (Mute, Speaker, Camera switch).
            - **Status Stories**: 24h photo updates with granular privacy settings (My Contacts, Private).
            - **Chat Capabilities**: Single/Double grey/blue ticks, View-Once media, Star messages, Copy text, Delete for everyone, and Quick Profile popup.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
